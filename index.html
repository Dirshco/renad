<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Zoom Meeting</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #2c3e50; margin-bottom: 8px; font-size: 24px; }
        p.meeting-id { color: #7f8c8d; margin-bottom: 24px; font-size: 14px; }
        .join-btn {
            display: inline-block;
            padding: 28px 48px;
            font-size: 22px;
            font-weight: 600;
            color: white;
            background-color: #2D8CFF;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(45, 140, 255, 0.3);
        }
        .join-btn:hover {
            background-color: #1A6DCC;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(45, 140, 255, 0.4);
        }
        .join-btn:active { transform: translateY(0); }
        .note { margin-top: 20px; font-size: 13px; color: #95a5a6; }
    </style>
</head>
<body>

    <div class="card">
        <h1> Renady Quran Lesson</h1>
        <h1>🎥 Ready to Join?</h1>
        <p class="meeting-id">Meeting ID: <span id="displayId">Loading...</span></p>
        
        <a id="zoomBtn" class="join-btn" href="#">JOIN MEETING</a>
        
        <p class="note">Clicking will open Zoom or your browser. Password is auto-filled.</p>
    </div>

    <script>
        // ⚙️ CONFIGURATION: Change these values to your meeting details
        const MEETING_ID = "7483321877";
        const MEETING_PASSWORD = "";

        // Generate Zoom universal join link
        const zoomUrl = `https://zoom.us/j/${MEETING_ID}?pwd=${MEETING_PASSWORD}`;

        // Apply to button and display ID on page
        document.getElementById("zoomBtn").href = zoomUrl;
        document.getElementById("displayId").textContent = MEETING_ID;
    </script>

</body>
</html>
